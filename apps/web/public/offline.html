<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — RouteGrade</title>
    <style>
      /* Standalone file: it can't import globals.css, so the tokens it needs
         are inlined here. Keep these in sync with @theme in globals.css. */
      :root {
        --canvas: #0a0a0a;
        --ink: #fafafa;
        --muted: #8c8c8c;
        --volt: #d8ff3e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 32ch;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 12px;
        padding: 13px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--volt);
        color: #0a0a0a;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>No connection</h1>
    <p>
      RouteGrade needs a network to plan and grade routes. Runs you've already
      finished are safe — they'll sync once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
